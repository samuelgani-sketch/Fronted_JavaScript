<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <link rel="stylesheet" href="./indexHT.css">
</head>
<body>
    <h1>My Tasks</h1>
    <form id="form">
        <input type="text" id="input" placeholder="Что нужно сделать?" autocomplete="off">
        <button type="submit">Добавить</button>
    </form>
    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Список пуст. Добавьте первую задачу.</p>
    <p id="counter" class="counter"></p>

    <!-- Всплывающее сообщение «Задача удалена · Отменить» -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
        <span id="toast-text"></span>
        <button type="button" id="toast-undo">Отменить</button>
    </div>

    <script src="./indexTH2.js"></script>
</body>
</html>
